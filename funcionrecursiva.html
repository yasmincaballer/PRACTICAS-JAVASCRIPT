<!DOCTYPE html>
<html>
<head>
    <title>Funcion recursiva</title>
</head>
<body>

    <h2>Cuenta regresiva</h2>

    <p id="resultado"></p>

    <script>
        function cuentaRegresiva(numero) {

            if (numero <= 0) {
                document.getElementById("resultado").innerHTML += "¡Despegue!";
                return;
            }

            document.getElementById("resultado").innerHTML += numero + "<br>";

            cuentaRegresiva(numero - 1);
        }

        cuentaRegresiva(3);
    </script>

</body>
</html>
