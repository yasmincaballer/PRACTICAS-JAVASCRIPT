<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo For</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Estructura For</h1>
    <script>
        // Imprime los números del 1 al 5 en la consola
        for (let i = 1; i <= 5; i++) {
            alert("Número: " + i);
        }
    </script>
    <a href="index.html" class="btn-inicio">Inicio</a>
</body>
</html>
