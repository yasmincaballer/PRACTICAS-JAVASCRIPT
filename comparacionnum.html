<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Numeros Mayores y Menores</h1>
    <script>
        let n1=prompt("Escribe el primer numero");
        let n2=prompt("Escribe el segundo numero");
        if(n1>=n2){
            alert("El numero mayor es:"+ n1 );
            alert("El numero menor es:"+ n2 );
        }
        else{
            alert("El numero mayor es :"+ n2 );
            alert("El numero menor es :"+ n1 );
        }
    </script>
    <a href="index.html" class="btn-inicio">Inicio</a>
</body>
</html>
